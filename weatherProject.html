<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a43">
  <title>Atmosphere - Weather Dashboard</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --glass: rgba(255, 255, 255, 0.74);
      --line: rgba(255, 255, 255, 0.64);
      --blue: #4d86c6;
      --orange: #ffb36b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 205, 142, .62), transparent 21rem),
        radial-gradient(circle at 92% 88%, rgba(84, 145, 211, .42), transparent 27rem),
        linear-gradient(145deg, #f7fbfd 0%, #ddebf3 52%, #c4d7e7 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 19rem;
      height: 19rem;
      right: -8rem;
      top: -9rem;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 50%;
      box-shadow: 0 0 0 3rem rgba(255,255,255,.08), 0 0 0 7rem rgba(255,255,255,.05);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 8rem;
      height: 8rem;
      left: -2rem;
      bottom: 8%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .25);
      box-shadow:
        14rem -28rem 0 2rem rgba(255,255,255,.10),
        72rem -18rem 0 5rem rgba(93,150,205,.05);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      to { transform: translate3d(24px, -18px, 0) scale(1.04); }
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      padding: 4px 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, #79b3de, #2f6497);
      box-shadow: 0 10px 24px rgba(49, 103, 156, .26), inset 0 1px 1px rgba(255,255,255,.5);
      font-size: 20px;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .4px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 999px;
      background: rgba(255,255,255,.38);
      backdrop-filter: blur(10px);
    }

    .search {
      display: flex;
      gap: 10px;
      width: min(610px, 100%);
      margin: 0 auto 22px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 21px;
      background: rgba(255,255,255,.28);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 38px rgba(64,98,128,.10);
    }

    .search-field {
      position: relative;
      flex: 1;
    }

    .search-field svg {
      position: absolute;
      left: 18px;
      top: 50%;
      width: 18px;
      transform: translateY(-50%);
      color: #829ab1;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid transparent;
      border-radius: 16px;
      outline: none;
      padding: 0 18px 0 48px;
      color: var(--ink);
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
      backdrop-filter: blur(14px);
      font: inherit;
      font-weight: 600;
      transition: .2s ease;
    }

    input:focus {
      border-color: rgba(77,134,198,.55);
      box-shadow: 0 12px 32px rgba(60,96,126,.12), 0 0 0 4px rgba(77,134,198,.10);
      background: rgba(255,255,255,.92);
    }

    button {
      height: 54px;
      border: 0;
      border-radius: 16px;
      padding: 0 22px;
      color: #fff;
      background: linear-gradient(135deg, #5e9bd1, #315f8c);
      box-shadow: 0 12px 25px rgba(49,95,140,.24), inset 0 1px 1px rgba(255,255,255,.25);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(49,95,140,.28); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .65; cursor: wait; }

    .dashboard {
      display: grid;
      grid-template-columns: 1.55fr .75fr;
      gap: 20px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--glass);
      box-shadow:
        0 22px 50px rgba(58, 91, 119, .14),
        inset 0 1px 0 rgba(255,255,255,.82);
      backdrop-filter: blur(18px);
    }

    .hero {
      min-height: 410px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 32px 36px 28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.78), rgba(225,239,247,.58)),
        radial-gradient(circle at 78% 62%, rgba(255,183,112,.18), transparent 12rem);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -88px;
      top: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,194,126,.34), transparent 64%);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: 45px;
      bottom: -105px;
      border: 1px solid rgba(77,134,198,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 28px rgba(77,134,198,.025), 0 0 0 56px rgba(77,134,198,.018);
    }

    .location { position: relative; z-index: 1; }
    .location h1 { margin: 0 0 7px; font-size: clamp(28px, 4vw, 44px); letter-spacing: -1.8px; }
    .location p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; }

    .weather-main {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
    }

    .temperature {
      margin: 0;
      font-size: clamp(82px, 10vw, 112px);
      line-height: .82;
      letter-spacing: -8px;
      font-weight: 780;
      text-shadow: 0 8px 24px rgba(40,75,108,.08);
      background: linear-gradient(180deg, #163b5c 20%, #52799a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .condition-wrap { min-width: 190px; text-align: right; }
    .weather-icon {
      width: 78px;
      height: 78px;
      margin: 0 0 5px auto;
      filter: drop-shadow(0 12px 10px rgba(86,125,153,.14));
    }
    .condition { margin: 0; font-size: 20px; font-weight: 800; }

    .side {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 20px;
    }

    .details {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(145deg, rgba(255,255,255,.84), rgba(236,244,248,.62));
    }

    .details h2 { margin: 0 0 16px; font-size: 15px; letter-spacing: .2px; }
    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      border-top: 1px solid rgba(92,126,154,.11);
    }
    .detail-label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .detail-value { font-size: 15px; font-weight: 850; }
    .detail-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: #4d86c6;
      background: rgba(77,134,198,.10);
    }

    .forecast {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      background: rgba(255,255,255,.66);
    }

    .forecast-item {
      min-height: 118px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.78), rgba(231,241,247,.50));
      border: 1px solid rgba(255,255,255,.68);
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }

    .forecast-item:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,.82);
      box-shadow: 0 14px 28px rgba(75,108,134,.12);
    }
    .forecast-day { color: var(--muted); font-size: 13px; font-weight: 800; }
    .forecast-temp { margin-top: 7px; font-size: 20px; font-weight: 850; }
    .forecast-icon { width: 48px; height: 48px; }

    .status {
      min-height: 410px;
      display: none;
      place-items: center;
      text-align: center;
      padding: 30px;
      grid-column: 1 / -1;
    }
    .status.visible { display: grid; }
    .status h2 { margin: 12px 0 6px; }
    .status p { margin: 0; color: var(--muted); }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(77,134,198,.15);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .dashboard { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr; }
      .forecast { grid-column: auto; }
      .hero { min-height: 350px; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 18px; }
      .topbar { margin-bottom: 18px; }
      .date { display: none; }
      .search { margin-bottom: 14px; }
      button { width: 54px; padding: 0; font-size: 0; }
      button::after { content: "→"; font-size: 20px; }
      .hero { min-height: 315px; padding: 24px 22px; }
      .weather-main { align-items: center; }
      .temperature { font-size: 78px; }
      .condition-wrap { min-width: 120px; }
      .weather-icon { width: 62px; height: 62px; }
      .forecast { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">☁</span>
        <span>Atmosphere</span>
      </div>
      <time class="date" id="date"></time>
    </header>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input id="weatherInp" type="text" placeholder="Search city..." aria-label="City name" required>
      </div>
      <button id="searchButton" type="submit">Search</button>
    </form>

    <section class="dashboard" id="dashboard">
      <article class="card hero" id="hero">
        <div class="location">
          <h1 id="cityName">Loading...</h1>
          <p id="locationMeta">Fetching current weather</p>
        </div>
        <div class="weather-main">
          <p class="temperature" id="temperature">--°</p>
          <div class="condition-wrap">
            <img class="weather-icon" id="weatherIcon" alt="" src="">
            <p class="condition" id="condition">Loading</p>
          </div>
        </div>
      </article>

      <aside class="card details">
        <h2>Weather details</h2>
        <div class="detail-row">
          <div class="detail-label"><span class="detail-icon">≋</span>Wind</div>
          <div class="detail-value" id="wind">--</div>
        </div>
        <div class="detail-row">
          <div class="detail-label"><span class="detail-icon">☀</span>Condition</div>
          <div class="detail-value" id="conditionDetail">--</div>
        </div>
      </aside>

      <section class="card forecast" id="forecast"></section>
      <section class="card status" id="status">
        <div>
          <div class="spinner" id="spinner"></div>
          <h2 id="statusTitle">Loading weather</h2>
          <p id="statusMessage">Please wait while we fetch the latest conditions.</p>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#searchForm");
    const input = document.querySelector("#weatherInp");
    const dashboard = document.querySelector("#dashboard");
    const statusCard = document.querySelector("#status");
    const spinner = document.querySelector("#spinner");
    const statusTitle = document.querySelector("#statusTitle");
    const statusMessage = document.querySelector("#statusMessage");
    const searchButton = document.querySelector("#searchButton");

    document.querySelector("#date").textContent =
      new Intl.DateTimeFormat("en", { weekday: "long", month: "long", day: "numeric" }).format(new Date());

    function weatherIcon(description) {
      const text = description.toLowerCase();
      if (text.includes("snow")) return "https://openweathermap.org/img/wn/13d@4x.png";
      if (text.includes("rain") || text.includes("drizzle")) return "https://openweathermap.org/img/wn/10d@4x.png";
      if (text.includes("thunder")) return "https://openweathermap.org/img/wn/11d@4x.png";
      if (text.includes("cloud") || text.includes("overcast")) return "https://openweathermap.org/img/wn/03d@4x.png";
      if (text.includes("mist") || text.includes("fog") || text.includes("haze")) return "https://openweathermap.org/img/wn/50d@4x.png";
      return "https://openweathermap.org/img/wn/01d@4x.png";
    }

    function setLoading(isLoading) {
      searchButton.disabled = isLoading;
      statusCard.classList.toggle("visible", isLoading);
      dashboard.querySelectorAll("#hero, .details, #forecast").forEach(el =>
        el.style.display = isLoading ? "none" : ""
      );
    }

    function showError(message) {
      setLoading(false);
      statusCard.classList.add("visible");
      spinner.style.display = "none";
      statusTitle.textContent = "Weather unavailable";
      statusMessage.textContent = message;
      dashboard.querySelectorAll("#hero, .details, #forecast").forEach(el => el.style.display = "none");
    }

    async function showWeather(city) {
      const query = city.trim();
      if (!query) return;

      spinner.style.display = "";
      statusTitle.textContent = "Loading weather";
      statusMessage.textContent = `Checking conditions in ${query}...`;
      setLoading(true);

      try {
        const response = await fetch(`https://goweather.xyz/v2/weather/${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error("City not found");
        const data = await response.json();
        if (!data.temperature || data.temperature === "") throw new Error("City not found");

        const description = data.description || "Clear";
        document.querySelector("#cityName").textContent = query
          .split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
        document.querySelector("#locationMeta").textContent = "Current weather";
        document.querySelector("#temperature").textContent = data.temperature;
        document.querySelector("#condition").textContent = description;
        document.querySelector("#conditionDetail").textContent = description;
        document.querySelector("#wind").textContent = data.wind || "--";

        const icon = weatherIcon(description);
        const weatherIconEl = document.querySelector("#weatherIcon");
        weatherIconEl.src = icon;
        weatherIconEl.alt = description;

        const forecast = document.querySelector("#forecast");
        forecast.innerHTML = (data.forecast || []).slice(0, 3).map((day, index) => {
          const dayName = index === 0 ? "Tomorrow" : `Day ${index + 1}`;
          return `
            <article class="forecast-item">
              <div>
                <div class="forecast-day">${dayName}</div>
                <div class="forecast-temp">${day.temperature}</div>
              </div>
              <img class="forecast-icon" src="${weatherIcon(day.description || description)}" alt="${day.description || description}">
            </article>`;
        }).join("");

        setLoading(false);
        statusCard.classList.remove("visible");
        dashboard.querySelectorAll("#hero, .details, #forecast").forEach(el => el.style.display = "");
        input.value = "";
      } catch (error) {
        showError("We couldn't find that city. Check the spelling and try again.");
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      showWeather(input.value);
    });

    showWeather("London");
  </script>
</body>
</html>
